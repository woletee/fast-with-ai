  } else if(m===2){ // dot matrix with a highlighted cluster
    const hx=r()*12|0, hy=r()*9|0;
    for(let x=0;x<13;x++)for(let y=0;y<10;y++){
      const d=Math.hypot(x-hx,y-hy), big=d<2.6;
      s+=`<circle cx="${20+x*30}" cy="${15+y*30}" r="${big?11:4+r()*3}" fill="${big?p[4]:(r()>.5?p[0]:p[1])}"/>`;}
  } else { // stacked slabs
    let y=H; while(y>0){const h=20+r()*60, w=120+r()*260; y-=h;
      s+=`<rect x="${(W-w)*r()}" y="${y}" width="${w}" height="${h-6}" fill="${pick([p[0],p[1],p[3],p[4]])}"/>`;}
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Placeholder artwork for ${esc(e.t)}">${s}</svg>`;
}

const grid=document.getElementById('grid');
document.getElementById('stats').innerHTML=`${E.length} records · ${Object.keys(FIELD).length} fields<br>2017 – 2026`;
function render(f){
  const rows=E.filter(e=>f==="all"||e.f===f).sort((a,b)=>b.d.localeCompare(a.d));
  grid.innerHTML=rows.map(e=>`<article class="card">
    <div class="row"><span class="date">${fmt(e.d)}</span><span class="tag">${FIELD[e.f]}</span></div>
    <div class="art">${e.img?`<img src="${esc(e.img)}" alt="Image for ${esc(e.t)}" class="${e.photo.fit}" loading="lazy" onerror="this.replaceWith(document.createRange().createContextualFragment(art(E[${e.n}])))">`:art(e)}</div>
    <div class="time"><b>${esc(e.big)}</b><span>${esc(e.vs)}</span></div>
    <h2>${esc(e.t)}</h2>
    <details><summary><span>Read more</span></summary>
      <div class="more">
        <span class="k">Who</span><span>${esc(e.who)}</span>
        <span class="k">Done</span><span>${esc(e.what)}</span>
        <span class="k">AI did</span><span>${esc(e.ai)}</span>
        ${e.flag?`<span class="k">Note</span><span class="flag">${esc(e.flag)}</span>`:''}
        <span class="k">Source</span><span>${e.src.map(([l,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a>`).join(' · ')}</span>
        ${e.photo?`<span class="k">Image</span><span><a href="${esc(e.photo.page)}" target="_blank" rel="noopener">${esc(e.photo.by)}</a></span>`:''}
      </div></details>
  </article>`).join("");
}
document.querySelectorAll('.pills button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.pills button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
  render(b.dataset.f);
}));
render("all");
</script>
</body>
